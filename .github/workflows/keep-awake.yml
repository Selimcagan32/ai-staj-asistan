name: Keep Streamlit app awake

on:
  schedule:
    # 2 saatte bir, saat başı yerine :17'de (GitHub saat başlarında çalışmaları atlayabiliyor)
    - cron: "17 */2 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Visit app
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python .github/scripts/keep_awake.py
